name: s4-preprocess
run: python main.py
setup: |
  pip install -q --upgrade "datasets>=3.0" "transformers>=4.45" numpy matplotlib
resources:
  cpus: 8
  memory: 32
  disk_space: 200
envs:
  HF_TOKEN: "{{secret._HF_TOKEN}}"
  HF_HUB_ENABLE_HF_TRANSFER: "0"
  TOKENIZERS_PARALLELISM: "true"
parameters:
  splits_object: tidepool/s4.3/splits.jsonl.gz
  tokenizer_id: LiquidAI/LFM2.5-1.2B-Instruct
  max_seq_len: 4096
  dedup_triples: true
  # A rule is a set of flags that must ALL be present; a row is dropped if it matches
  # ANY rule. Over-refusal is a pair because either flag alone is weak evidence.
  drop_rules: '[["contaminated"],["tool_name_mismatch"],["parse_failure"],["suspect_over_refusal","label_contradiction"]]'
  token_stats_subsample: 40000
minutes_requested: 240
