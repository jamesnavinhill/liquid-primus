name: s5-sft-pack
run: python pack.py
setup: |
  python -c "import torch" 2>/dev/null || pip install -q torch
  pip install -q -U transformers peft accelerate wandb
  python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
resources:
  # Four trainers share the card, so the host has to feed four of them: dataloader workers,
  # four tokenizer passes and four checkpoint writes. The GPU count is what the quota is
  # priced on, so a fatter host is free -- an under-provisioned one would simply starve the
  # card, which is the whole thing this task exists to avoid.
  cpus: 16
  memory: 96
  disk_space: 300
  accelerators: "L40S:1"
  compute_provider: aws
envs:
  HF_TOKEN: "{{secret._HF_TOKEN}}"
  WANDB_API_KEY: "{{secret._WANDB_API_KEY}}"
parameters:
  # Comma-separated arms to run concurrently on this one card. Everything below is passed
  # through to each child unchanged, so a packed arm's recipe is byte-identical to the same
  # arm queued alone; only `arm` is overridden, per child, from this list.
  arms: ""
  # Fraction of the card the children may divide between them. The remainder is left for
  # fragmentation, the CUDA context each process holds, and the transient peak during model
  # load. Each child is capped at pack_headroom / len(arms) and fails alone if it exceeds it.
  pack_headroom: 0.92
  # Comma-separated, parallel to `arms`; empty means equal shares. The arms do not have equal
  # appetites -- a full-parameter arm carries gradients and fp32 optimizer moments for every
  # parameter, several times what a rank-16 adapter needs -- so an even split would starve it
  # while the LoRA arms sat under ceilings they never approach.
  pack_weights: ""
  # Preferred over pack_weights: each arm's ceiling in gigabytes, parallel to `arms`. Absolute
  # is the right unit here because it is the unit the measurements arrive in (a LoRA r16 arm
  # holds 7.5 GB as the driver sees it, the entropy-weighted arm 11.4, a full-parameter arm
  # about 22) and because relative shares divide the card between arms that never coexist.
  pack_gb: ""
  # The card the ceilings are measured against. An L40S reports 47.7 GB decimal.
  card_gb: 47.7
  # `arm=script.py`. An arm does not have to be a trainer: the replay generator runs as one.
  pack_scripts: ""
  # `arm=other_arm`. Holds an arm back until the other has exited clean. One level deep.
  pack_after: ""
  # `arm=config_key:filename`. When that arm finishes, out/<arm>/<filename> becomes the local
  # stand-in for the object config_key names, and the supervisor uploads it there once. It is
  # how a buffer generated on this card reaches the arms consuming it without a round trip,
  # while still landing in shared storage for every later stage.
  pack_provides: ""
  # JSON: `{"<arm>": {"<key>": <value>}}`, merged onto the shared config for that arm alone.
  # The sweep trainer does not need it -- `arm` selects a recipe from a table inside main.py --
  # but a program whose arms differ by which checkpoint and which component they run cannot
  # recognise itself from a name, and this is how such an arm is configured without pushing an
  # arm table into every future child script. JSON rather than a bare string so values keep
  # their types.
  pack_overrides: ""
  # How often the supervisor looks at its children. Only lowered by the scheduling tests.
  poll_seconds: 5
  # Every child peaks its memory while loading the same base model. Starting them together
  # stacks load peaks the steady state would never reach, so they are spaced out.
  stagger_seconds: 45
  shutdown_grace_seconds: 30
  # A hung arm is the one failure a process boundary does not contain: it holds its slice
  # of the card and the pack sits behind it until the job's wall clock kills everything.
  # A child that produces no output at all for this long is killed on its own. Generous,
  # because legitimate quiet stretches exist (model download, corpus indexing, validation)
  # and killing a merely slow arm is worse than waiting for it.
  stall_minutes: 45
  run_tag: s5.3-pack
  base_model: LiquidAI/LFM2.5-1.2B-Instruct
  train_object: tidepool/s4.4/train.jsonl.gz
  val_object: tidepool/s4.4/val.jsonl.gz
  guardrail_object: tidepool/s5.3/tooldata/tooldata_train.jsonl.gz
  replay_object: ""
  budget_tokens: 64000000
  guardrail_epochs: 2.0
  replay_frac: 0.0
  entropy_beta: 1.0
  mix: role_balanced
  tuning: lora
  loss: ce
  max_seq_len: 2048
  micro_batch_size: 2
  grad_accum: 8
  learning_rate: 1e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  val_rows: 256
  warmup_ratio: 0.03
  tool_epochs: 1.0
  struct_max_epochs: 3.0
  min_priority_share: 0.5
  seed: 17
  arm: C1
  # Read by replay.py when the pack carries a self-distillation arm; ignored by every other
  # arm. Defaults match the s5-selfdistill task these were validated on.
  pool_object: tidepool/s4.4/prompt_pool.jsonl.gz
  dest_prefix: tidepool/s5.3/replay
  n_prompts: 8000
  max_new_tokens: 320
  batch_size: 48
  max_prompt_tokens: 1024
  sample_salt: tidepool-replay-v1
  c5b_dose_tokens: 3200000
  smoke: false
  smoke_rows: 512
  max_steps: 0
# A pack runs every arm it carries, so its wall clock is the slowest arm's, not the sum. Sized
# for a full-parameter arm sharing a card: those are the slowest thing this sweep runs, and a
# pack cut off at the wall loses every arm on the card, not one.
minutes_requested: 1200
