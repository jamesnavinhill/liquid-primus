# s5.2 — the project's evaluation harness. One model per queue; every number in the
# baseline row, the sweep, the tuning runs and the final checkpoints comes from this task,
# so the card and the serving path are pinned here and not chosen per run.
#
# The L4 is the eval card for every full-precision comparison: it has bf16, it is a
# three-source card (AWS, GCP, RunPod) so a run is not hostage to one provider, and the
# earlier smoke already ran on it. Changing card mid-project would put the FP numbers on
# two different sets of numerics, so it stays fixed and is recorded in each summary.
name: s5-eval
run: python main.py
setup: |
  python -c "import torch" 2>/dev/null || pip install -q torch
  pip install -q -U transformers peft accelerate huggingface_hub
  # Scoring dependencies only. IFStruct's validator needs PyYAML; Google's IFEval
  # registry needs absl-py, immutabledict, langdetect and nltk. nltk is pinned below 3.9
  # because the registry loads the punkt *pickle*, which 3.9 removed in favour of
  # punkt_tab, and an unpinned install fails on sentence-count instructions only.
  pip install -q "pyyaml>=6" absl-py immutabledict langdetect "nltk==3.8.1"
resources:
  cpus: 8
  memory: 32
  disk_space: 100
  accelerators: "L4:1"
envs:
  HF_TOKEN: "{{secret._HF_TOKEN}}"
parameters:
  base_model: LiquidAI/LFM2.5-1.2B-Instruct
  # A storage path to a LoRA adapter directory, merged before evaluation. Empty = the
  # base checkpoint as published.
  adapter_object: ""
  run_tag: s5.2-harness-smoke
  components: bfcl,ifstruct,ifeval,probes
  # Both surface forms for the tool contract: the s4 training convention and the model's
  # own native tools= rendering. A baseline's score is the better of the two.
  bfcl_styles: tools_text,native_tools
  bfcl_categories: simple,multiple,parallel,parallel_multiple,live_simple,live_multiple,live_parallel,live_parallel_multiple,irrelevance,live_irrelevance,live_relevance
  probes_object: tidepool/s4.4/probes/probes.jsonl
  # The enlarged clean arm built at s5.3: 138 real intact tool returns from the held-out
  # splits, against the frozen arm's 30 synthetic ones. Empty by default so a re-run of an
  # already-measured baseline row stays byte-comparable to the row it replaces. Set it, and
  # the items arrive tagged clean_corpus and report under their own summary keys; every
  # pre-existing key keeps the meaning it had when B1 through B6 were measured.
  clean_control_object: ""
  # 0 = the whole component. Anything else is a smoke, and the summary says so.
  limit_per_component: 40
  # Per-component caps. -1 inherits limit_per_component, 0 means the full set. Set
  # explicitly per run so a screening profile is a recorded parameter and not a habit.
  limit_bfcl: -1
  limit_ifstruct: -1
  limit_ifeval: -1
  limit_probes: -1
  # `calibration` is not a benchmark: it reads the model's probability on one frozen
  # auditor turn per tool-return probe, which is the scalar the free-form flag rate does
  # not have. It needs the transformers backend and it needs a clean arm to be the
  # negatives, so set clean_control_object with it. Add it to `components` to run it.
  limit_calibration: -1
  # ---- `cdd`: the black-box memorization check (2402.15938v3), not a benchmark. Add it to
  # `components` to run it. It samples, which every other component in this harness refuses to
  # do, and it reaches sampling through its own runner entry point so no benchmark path can
  # arrive there by accident. Transformers only: the two arms are compared against each other,
  # so a 4-bit arm with its own sampler would not be measuring the same thing.
  limit_cdd: -1
  # Paper defaults throughout. alpha and xi are hand-set per domain in the paper and were never
  # tuned on a rigid-schema task like tool calling, which is exactly why the result reported
  # from this is the PAIRED difference against the untrained base rather than the raw number.
  cdd_samples: 51
  cdd_temperature: 0.8
  cdd_alpha: 0.05
  cdd_xi: 0.01
  cdd_l_cap: 100
  cdd_seed: 0
  # The surface form the reported composite is taken on. Peakedness on a differently-rendered
  # prompt is peakedness on a different distribution.
  cdd_style: native_tools
  # A storage object (or an inline JSON list) naming the eval items whose text appears in a
  # training target, written by the decontamination scan at this same substage. Each is paired
  # with a same-category, nearest-prompt-length item that has no overlap at all. Empty means no
  # strata, which costs the interaction test and is recorded as a note on the run.
  cdd_contaminated_ids: ""
  cdd_max_pairs: 60
  # Extra items outside the strata, spread round-robin across categories. The strata are only
  # as large as the contamination found -- three scored BFCL items on this project -- so the
  # interaction test is small by necessity. The paired base-versus-tuned difference is the other
  # reading here, on how far fine-tuning narrowed the output distribution, and it wants items.
  cdd_background: 0
  # Concurrent sequences per sampling call. 51 samples of a 3k-token BFCL prompt is a prefill
  # of batch 51; the card does not hold that, and the call halves itself on out-of-memory
  # exactly as a generation group does.
  cdd_sample_chunk: 8
  # Optional, per arm: the arm's already-recorded scored_probes.jsonl, so the scalar can be
  # ranked against the free-form flags this project actually published without regenerating
  # 602 completions to get them back. Left empty, the join uses this run's own probe output
  # if `probes` ran in the same run, and is simply omitted if neither is there.
  free_form_scored_object: ""
  profile: ""
  # ---- score-only replay. Non-empty = read every component's completions from this storage
  # directory instead of generating them: no weights, no GPU, no tokens. It exists because
  # scoring is deterministic CPU work over saved text, so a grader fix after eight sweep arms
  # costs one CPU pass rather than eight GPU passes, and because anything a run computed but
  # did not print comes back without paying for generation twice. The prompts are re-rendered
  # and checked against each recorded prompt hash, so a moved chat template shows up as an
  # assertion failure rather than as a quietly incomparable number.
  rescore_object: ""
  # ---- the 4-bit serving path. backend=gguf switches every row below to llama.cpp; the
  # scoring, prompting and item selection are unchanged, which is what makes a Q4 row
  # comparable to the FP row above it.
  backend: hf
  # The stored serving path built once by s5-llama-build at a pinned tag. A Q4 number taken
  # against an unpinned backend is not comparable to the next one.
  llama_object: ""
  gguf_repo: ""
  # Required explicitly: these repos publish a dozen quantizations and picking one by pattern
  # is a choice a run should not make for itself.
  gguf_file: ""
  # The full-precision repo the GGUF was quantized from. It renders the prompts, so a Q4 row
  # and its FP reference see the same bytes. Empty falls back to base_model.
  tokenizer_repo: LiquidAI/LFM2.5-1.2B-Instruct
  gguf_parallel: 8
  gguf_ctx_per_slot: 8192
  gguf_port: 8080
  batch_size: 16
  max_new_bfcl: 320
  max_new_ifstruct: 768
  max_new_ifeval: 768
  max_new_probes: 320
# The ceiling is set for the slowest run this task will ever do, because a job cut off at the
# ceiling throws away the whole pass while still being billed for it. A full pass on the 1.2B
# checkpoint measures ~1.5 h of task time. The competitor baseline is four times slower per
# token at the same batch size on the same card, which puts its full pass near 5 h, so the
# ceiling is 7 h. Batch size stays at 16 for every row rather than being raised for the slow
# one: a couple of GPU-hours is cheaper than a baseline row that was served differently from
# the reference it is compared against. Screened runs finish in well under half an hour and are
# billed for what they use.
minutes_requested: 420
