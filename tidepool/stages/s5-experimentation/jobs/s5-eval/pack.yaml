# s5/s6 — the evaluation harness, several models at once on one card.
#
# The same `main.py` the solo eval task runs, supervised by the same `pack.py` the sweep
# uses. An eval pass alternates a generation batch with a stretch of CPU-bound grading, so a
# card running one of them is idle for a good part of its own job; `s6` has eight checkpoints
# to score over four components, which one-per-card is eight card-hours to do about three
# cards' worth of work.
#
# The card stays an L4 and is not negotiable. Every full-precision number in this project was
# taken on one, and moving the comparison onto a second set of numerics to gain a bigger card
# would cost more than the card-hours it saved. What packing changes is how many models share
# it, never which one it is.
#
# Arms here differ in their *inputs* rather than in a recipe name, so each arm's checkpoint,
# components and caps arrive through `pack_overrides` and the supervisor stages the objects
# named there alongside the shared ones. Two 4-bit arms are safe on one card because each
# child derives its server port from its position in the pack; two on the same port would not
# fail loudly, the second would die on bind and the first would answer both.
name: s5-eval-pack
run: python pack.py
setup: |
  python -c "import torch" 2>/dev/null || pip install -q torch
  pip install -q -U transformers peft accelerate huggingface_hub
  # Scoring dependencies only. IFStruct's validator needs PyYAML; Google's IFEval
  # registry needs absl-py, immutabledict, langdetect and nltk. nltk is pinned below 3.9
  # because the registry loads the punkt *pickle*, which 3.9 removed in favour of
  # punkt_tab, and an unpinned install fails on sentence-count instructions only.
  pip install -q "pyyaml>=6" absl-py immutabledict langdetect "nltk==3.8.1"
resources:
  # Feeding three or four scoring children at once: each holds its own tokenizer, its own
  # grader pass and its own completions on disk. The GPU count is what the quota prices, so
  # the fatter host is free and an under-provisioned one would starve the card.
  cpus: 16
  memory: 64
  disk_space: 200
  accelerators: "L4:1"
  compute_provider: aws
envs:
  HF_TOKEN: "{{secret._HF_TOKEN}}"
parameters:
  # Comma-separated arms to run concurrently on this one card. Everything below is passed
  # through to each child unchanged, so a packed arm's recipe is byte-identical to the same
  # arm queued alone; only `arm` is overridden, per child, from this list.
  arms: ""
  # Fraction of the card the children may divide between them. The remainder is left for
  # fragmentation, the CUDA context each process holds, and the transient peak during model
  # load. Each child is capped at pack_headroom / len(arms) and fails alone if it exceeds it.
  pack_headroom: 0.92
  # Comma-separated, parallel to `arms`; empty means equal shares. The arms do not have equal
  # appetites -- a full-parameter arm carries gradients and fp32 optimizer moments for every
  # parameter, several times what a rank-16 adapter needs -- so an even split would starve it
  # while the LoRA arms sat under ceilings they never approach.
  pack_weights: ""
  # Preferred over pack_weights: each arm's ceiling in gigabytes, parallel to `arms`. Absolute
  # is the right unit here because it is the unit the measurements arrive in (a LoRA r16 arm
  # holds 7.5 GB as the driver sees it, the entropy-weighted arm 11.4, a full-parameter arm
  # about 22) and because relative shares divide the card between arms that never coexist.
  #
  # Those three figures are for TRAINING. Scoring is a different appetite and was measured
  # separately, by job `97939c69`: four arms under 5.2 GB ceilings all died at the first BFCL
  # batch, each with 4.41 GB allocated and 772 MB more wanted. Prefill holds the batch times
  # the sequence length times the FFN width, and BFCL's tool schemas run to about 3k tokens,
  # so at batch 16 an arm needs a little over 5.2 GB of allocator space plus ~0.3 GB of CUDA
  # context. Two arms an L4 at 11 GB is the sized figure; four does not fit at this batch.
  # Packing buys much less here than it does in training, because generation saturates the
  # card while training leaves it idle between steps, so there is little to reclaim by
  # crowding. `gen.py` halves a batch that does not fit rather than dying, which makes a
  # ceiling set too low cost throughput; it does not make an undersized ceiling free.
  pack_gb: ""
  # The card the ceilings are measured against. An L40S reports 47.7 GB decimal.
  # `arm=script.py`. An arm does not have to be a trainer: the replay generator runs as one.
  pack_scripts: ""
  # `arm=other_arm`. Holds an arm back until the other has exited clean. One level deep.
  pack_after: ""
  # `arm=config_key:filename`. When that arm finishes, out/<arm>/<filename> becomes the local
  # stand-in for the object config_key names, and the supervisor uploads it there once. It is
  # how a buffer generated on this card reaches the arms consuming it without a round trip,
  # while still landing in shared storage for every later stage.
  pack_provides: ""
  # JSON: `{"<arm>": {"<key>": <value>}}`, merged onto the shared config for that arm alone.
  # The sweep trainer does not need it -- `arm` selects a recipe from a table inside main.py --
  # but a program whose arms differ by which checkpoint and which component they run cannot
  # recognise itself from a name, and this is how such an arm is configured without pushing an
  # arm table into every future child script. JSON rather than a bare string so values keep
  # their types.
  pack_overrides: ""
  # How often the supervisor looks at its children. Only lowered by the scheduling tests.
  poll_seconds: 5
  # Every child peaks its memory while loading the same base model. Starting them together
  # stacks load peaks the steady state would never reach, so they are spaced out.
  stagger_seconds: 45
  shutdown_grace_seconds: 30
  # A hung arm is the one failure a process boundary does not contain: it holds its slice
  # of the card and the pack sits behind it until the job's wall clock kills everything.
  # A child that produces no output at all for this long is killed on its own. Generous,
  # because legitimate quiet stretches exist (model download, corpus indexing, validation)
  # and killing a merely slow arm is worse than waiting for it.
  stall_minutes: 45
  # An L4 reports 24.0 GB decimal. A full-precision 1.2B arm holds its weights in bf16 plus
  # a batch of activations; measure the first packed run and set pack_gb from what the driver
  # saw, exactly as the sweep's ceilings were set, rather than from max_memory_allocated.
  card_gb: 24.0
  base_model: LiquidAI/LFM2.5-1.2B-Instruct
  # A storage path to a LoRA adapter directory, merged before evaluation. Empty = the
  # base checkpoint as published.
  adapter_object: ""
  run_tag: s5.2-harness-smoke
  components: bfcl,ifstruct,ifeval,probes
  # Both surface forms for the tool contract: the s4 training convention and the model's
  # own native tools= rendering. A baseline's score is the better of the two.
  bfcl_styles: tools_text,native_tools
  bfcl_categories: simple,multiple,parallel,parallel_multiple,live_simple,live_multiple,live_parallel,live_parallel_multiple,irrelevance,live_irrelevance,live_relevance
  probes_object: tidepool/s4.4/probes/probes.jsonl
  # The enlarged clean arm built at s5.3: 138 real intact tool returns from the held-out
  # splits, against the frozen arm's 30 synthetic ones. Empty by default so a re-run of an
  # already-measured baseline row stays byte-comparable to the row it replaces. Set it, and
  # the items arrive tagged clean_corpus and report under their own summary keys; every
  # pre-existing key keeps the meaning it had when B1 through B6 were measured.
  clean_control_object: ""
  # 0 = the whole component. Anything else is a smoke, and the summary says so.
  limit_per_component: 40
  # Per-component caps. -1 inherits limit_per_component, 0 means the full set. Set
  # explicitly per run so a screening profile is a recorded parameter and not a habit.
  limit_bfcl: -1
  limit_ifstruct: -1
  limit_ifeval: -1
  limit_probes: -1
  # `calibration` is not a benchmark: it reads the model's probability on one frozen
  # auditor turn per tool-return probe, which is the scalar the free-form flag rate does
  # not have. It needs the transformers backend and it needs a clean arm to be the
  # negatives, so set clean_control_object with it. Add it to `components` to run it.
  limit_calibration: -1
  # ---- `cdd`: the black-box memorization check (2402.15938v3), not a benchmark. Add it to
  # `components` to run it. It samples, which every other component in this harness refuses to
  # do, and it reaches sampling through its own runner entry point so no benchmark path can
  # arrive there by accident. Transformers only: the two arms are compared against each other,
  # so a 4-bit arm with its own sampler would not be measuring the same thing.
  limit_cdd: -1
  # Paper defaults throughout. alpha and xi are hand-set per domain in the paper and were never
  # tuned on a rigid-schema task like tool calling, which is exactly why the result reported
  # from this is the PAIRED difference against the untrained base rather than the raw number.
  cdd_samples: 51
  cdd_temperature: 0.8
  cdd_alpha: 0.05
  cdd_xi: 0.01
  cdd_l_cap: 100
  cdd_seed: 0
  # The surface form the reported composite is taken on. Peakedness on a differently-rendered
  # prompt is peakedness on a different distribution.
  cdd_style: native_tools
  # A storage object (or an inline JSON list) naming the eval items whose text appears in a
  # training target, written by the decontamination scan at this same substage. Each is paired
  # with a same-category, nearest-prompt-length item that has no overlap at all. Empty means no
  # strata, which costs the interaction test and is recorded as a note on the run.
  cdd_contaminated_ids: ""
  cdd_max_pairs: 60
  # Extra items outside the strata, spread round-robin across categories. The strata are only
  # as large as the contamination found -- three scored BFCL items on this project -- so the
  # interaction test is small by necessity. The paired base-versus-tuned difference is the other
  # reading here, on how far fine-tuning narrowed the output distribution, and it wants items.
  cdd_background: 0
  # Concurrent sequences per sampling call. 51 samples of a 3k-token BFCL prompt is a prefill
  # of batch 51; the card does not hold that, and the call halves itself on out-of-memory
  # exactly as a generation group does.
  cdd_sample_chunk: 8
  # Optional, per arm: the arm's already-recorded scored_probes.jsonl, so the scalar can be
  # ranked against the free-form flags this project actually published without regenerating
  # 602 completions to get them back. Left empty, the join uses this run's own probe output
  # if `probes` ran in the same run, and is simply omitted if neither is there.
  free_form_scored_object: ""
  profile: ""
  # ---- score-only replay. Non-empty = read every component's completions from this storage
  # directory instead of generating them: no weights, no GPU, no tokens. It exists because
  # scoring is deterministic CPU work over saved text, so a grader fix after eight sweep arms
  # costs one CPU pass rather than eight GPU passes, and because anything a run computed but
  # did not print comes back without paying for generation twice. The prompts are re-rendered
  # and checked against each recorded prompt hash, so a moved chat template shows up as an
  # assertion failure rather than as a quietly incomparable number.
  rescore_object: ""
  # ---- the 4-bit serving path. backend=gguf switches every row below to llama.cpp; the
  # scoring, prompting and item selection are unchanged, which is what makes a Q4 row
  # comparable to the FP row above it.
  backend: hf
  # The stored serving path built once by s5-llama-build at a pinned tag. A Q4 number taken
  # against an unpinned backend is not comparable to the next one.
  llama_object: ""
  gguf_repo: ""
  # Required explicitly: these repos publish a dozen quantizations and picking one by pattern
  # is a choice a run should not make for itself.
  gguf_file: ""
  # The full-precision repo the GGUF was quantized from. It renders the prompts, so a Q4 row
  # and its FP reference see the same bytes. Empty falls back to base_model.
  tokenizer_repo: LiquidAI/LFM2.5-1.2B-Instruct
  gguf_parallel: 8
  gguf_ctx_per_slot: 8192
  gguf_port: 8080
  batch_size: 16
  max_new_bfcl: 320
  max_new_ifstruct: 768
  max_new_ifeval: 768
  max_new_probes: 320
# Wall clock is the slowest arm on the card, not the sum, so the ceiling is the solo one with
# room for the contention several arms put on the host's CPUs during grading.
minutes_requested: 600
